name: Deploy Flutter Web to GitHub Pages

# Manual only. The target Pages repository (muhamaadessam.github.io) now holds
# the Next.js portfolio source, and this job force-pushes over its main branch.
# Do not re-enable an automatic trigger without changing the deploy target.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      # 3. Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Build web
      - name: Build web
        run: flutter build web --release

      # 5. Deploy to GitHub Pages repo
      - name: Deploy to GitHub Pages repo
        run: |
          cd build/web

          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git branch -M main

          git add .

          git commit -m "Deploy $(date)" || echo "No changes to commit"

          git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/muhamaadessam/muhamaadessam.github.io.git

          git push -f origin main